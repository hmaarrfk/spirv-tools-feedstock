{% set version = "2026.2" %}
# v2026.2's DEPS pins headers at vulkan-sdk-1.4.350.1, but we intentionally build
# against the newer vulkan-sdk-1.4.357.0 headers (the DEPS pin of the SPIRV-Tools
# vulkan-sdk-1.4.357.0 tag, which contains v2026.2): the run_constrained below pins
# downstream consumers to the headers we build with, and intel-graphics-compiler
# >=2.40 needs SPV_INTEL_predicated_io from headers 1.4.357.0.
{% set headers_version = "1.4.357.0" %}

package:
  name: spirv-tools
  version: "{{ version }}"

source:
  url: https://github.com/KhronosGroup/SPIRV-Tools/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b4390652e64ab188eede9d556cf183b3c1c4be44d4fcd104b0d4af3bea2712d1
  patches:
    - 0001-Get-package-version-and-description-from-conda-build.patch

build:
  run_exports:
    # They seem to be using calver, so their version numbers are not very informative
    # But we expect these to be rather stable
    # so lets try 'x' https://github.com/conda-forge/spirv-tools-feedstock/issues/3
    - {{ pin_subpackage('spirv-tools', 'x') }}
  number: 2

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make    # [unix]
    - ninja   # [win]
    - python
  host:
    - spirv-headers {{ headers_version }}
  run_constrained:
    - {{ pin_compatible('spirv-headers', max_pin='x.x.x.x') }}

test:
  commands:
    - spirv-as -h

about:
  home: https://github.com/KhronosGroup/SPIRV-Tools
  license: Apache-2.0
  license_file: LICENSE
  summary: The SPIR-V Tools project provides an API and commands for processing SPIR-V modules.

extra:
  recipe-maintainers:
    - oleksandr-pavlyk
    - ZzEeKkAa
    - isuruf
    - hmaarrfk
    - JarrettSJohnson
